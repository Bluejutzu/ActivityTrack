name: Release tracker

# Builds the Windows tracker installer (Tauri / NSIS) and attaches it to a
# GitHub Release whenever a v* tag is pushed (e.g. git tag v0.1.0 && git push --tags).

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'apps/desktop/**'

jobs:
  build-tracker:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Create the pre-configured config.json from GitHub secrets.
      # This will be bundled into the installer and copied to %ProgramData%
      # on installation. The installer uses these values by default.
      - name: Create installer config
        run: |
          mkdir -p apps/desktop/src-tauri/bundle/nsis/config-staging
          $configJson = @{
            convexUrl = "${{ secrets.ACTIVITYTRACK_CONVEX_URL }}"
            ingestKey = "${{ secrets.ACTIVITYTRACK_INGEST_KEY }}"
          } | ConvertTo-Json
          $configJson | Out-File -Encoding UTF8 -FilePath "apps/desktop/src-tauri/bundle/nsis/config-staging/config.json"
        shell: pwsh

      # Builds the frontend (beforeBuildCommand) + the Rust app, bundles the
      # NSIS installer, and uploads it to the release for this tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ActivityTrack ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
