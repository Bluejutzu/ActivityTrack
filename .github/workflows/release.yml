name: Release tracker

# Builds the Windows tracker installer (Tauri / NSIS) and attaches it to a
# GitHub Release whenever a v* tag is pushed (e.g. git tag v0.2.0 && git push --tags).
# Use scripts/bump-version.sh to update all version files and create the tag.

on:
  push:
    tags:
      - "v*"

jobs:
  build-tracker:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile --filter @activitytrack/desktop...

      # Fail early if the three desktop version files disagree, or don't match
      # the pushed tag — a desync makes the updater's latest.json lie.
      - name: Check version sync
        run: node scripts/check-version-sync.js ${{ github.ref_name }}
        shell: bash

      # Fail fast (with an actionable message) if the updater signing key is
      # missing, instead of a cryptic tauri-action failure deep in the build.
      # Artifacts MUST be signed with the key matching tauri.conf.json's pubkey
      # or every installed agent silently stops auto-updating. See docs/releasing.md.
      - name: Verify updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Releases must be signed with the key that matches tauri.conf.json's updater pubkey, or auto-update breaks for all installed agents. Set TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) in repo secrets. See docs/releasing.md."
            exit 1
          fi

      # Bake the real config values into the NSIS hook at build time.
      # The hook writes %ProgramData%\ActivityTrack\config.json on first install
      # using FileWrite, so there's no dependency on where Tauri places resources.
      - name: Inject config into NSIS hook
        shell: pwsh
        run: |
          $convexUrl = '${{ secrets.ACTIVITYTRACK_CONVEX_URL }}'
          $apiUrl    = '${{ vars.ACTIVITYTRACK_API_URL }}'
          $json = '{"convexUrl":"' + $convexUrl + '","apiUrl":"' + $apiUrl + '"}'
          $nshLines = @(
            '; Generated by release.yml -- do not edit manually.',
            '!macro NSIS_HOOK_POSTINSTALL',
            '  Push $0',
            '  CreateDirectory "$COMMONAPPDATA\ActivityTrack"',
            '  CreateDirectory "$COMMONAPPDATA\ActivityTrack\update"',
            '  IfFileExists "$COMMONAPPDATA\ActivityTrack\config.json" nsis_at_config_exists',
            '  FileOpen $0 "$COMMONAPPDATA\ActivityTrack\config.json" w',
            "  FileWrite `$0 '$json'",
            '  FileClose $0',
            '  nsis_at_config_exists:',
            '  WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Run" "ActivityTrack" ''"$INSTDIR\ActivityTrack.exe"''',
            '  nsExec::Exec `"$WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand `',
            '  Pop $0',
            '!macroend',
            '!macro NSIS_HOOK_PREUNINSTALL',
            '  DeleteRegValue HKLM "Software\Microsoft\Windows\CurrentVersion\Run" "ActivityTrack"',
            '  nsExec::Exec `"$SYSDIR\schtasks.exe" /Delete /TN "ActivityTrackUpdate" /F`',
            '!macroend'
          )
          $nshLines -join "`r`n" | Out-File -Encoding UTF8 -FilePath 'apps/desktop/src-tauri/bundle/nsis/installer.nsh'

      # Generate changelog from commits in apps/desktop since the previous tag.
      # Build the release body with GitHub's native notes generator (the same
      # output as the "Generate release notes" button). Each merged PR becomes
      # "* <title> by @author in #123" with working PR links, plus a New
      # Contributors section and a Full Changelog compare link — none of which
      # the old `git log` text (plain %h hashes) rendered as links. Range is the
      # previous v* tag → this tag; categorization/exclusions come from
      # .github/release.yml.
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          ARGS=(-f tag_name="${{ github.ref_name }}")
          if [ -n "$PREVIOUS_TAG" ]; then
            ARGS+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          BODY=$(gh api --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            "${ARGS[@]}" --jq .body)
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "$BODY"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      # Builds the frontend (beforeBuildCommand) + the Rust app, bundles the
      # NSIS installer, signs the artifacts for the auto-updater, and uploads
      # everything to a new GitHub Release for this tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACTIVITYTRACK_CONVEX_URL: ${{ secrets.ACTIVITYTRACK_CONVEX_URL }}
          ACTIVITYTRACK_API_URL: ${{ vars.ACTIVITYTRACK_API_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ActivityTrack ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: pnpm tauri

      # Clean up the tag if the release build failed.
      - name: Clean up failed tag
        if: failure()
        run: |
          git push origin --delete ${{ github.ref_name }}
          git tag -d ${{ github.ref_name }}
        shell: bash
