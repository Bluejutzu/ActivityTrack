name: Release tracker

# Builds the Windows tracker installer (Tauri / NSIS) and attaches it to a
# GitHub Release whenever a v* tag is pushed (e.g. git tag v0.2.0 && git push --tags).
# Use scripts/bump-version.sh to update all version files and create the tag.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tracker:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile --filter @activitytrack/desktop...

      # Create the pre-configured config.json from GitHub secrets.
      # This will be bundled into the installer and copied to %ProgramData%
      # on installation. The installer uses these values by default.
      - name: Create installer config
        run: |
          $configJson = @{
            convexUrl = "${{ secrets.ACTIVITYTRACK_CONVEX_URL }}"
            ingestKey = "${{ secrets.ACTIVITYTRACK_INGEST_KEY }}"
          } | ConvertTo-Json
          $configJson | Out-File -Encoding UTF8 -FilePath "apps/desktop/src-tauri/bundle/nsis/config-staging/config.json"
        shell: pwsh

      # Generate changelog from commits since the previous tag.
      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s")
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      # Builds the frontend (beforeBuildCommand) + the Rust app, bundles the
      # NSIS installer, signs the artifacts for the auto-updater, and uploads
      # everything to a new GitHub Release for this tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ActivityTrack ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.changes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: pnpm tauri

      # Clean up the tag if the release build failed.
      - name: Clean up failed tag
        if: failure()
        run: |
          git push origin --delete ${{ github.ref_name }}
          git tag -d ${{ github.ref_name }}
        shell: bash
