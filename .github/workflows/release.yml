name: Release desktop agent

# Builds the Windows installer and attaches it to a GitHub Release whenever a
# v* tag is pushed (e.g. git tag v0.1.0 && git push --tags).

on:
  push:
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build agent
        run: pnpm --filter @activitytrack/desktop build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pnpm --filter @activitytrack/desktop build:installer

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/installer/Output/*.exe
          generate_release_notes: true
