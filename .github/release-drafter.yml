name-template: 'ActivityTrack $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'bugfix'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '🎨 UI/UX'
    labels:
      - 'ui'
      - 'ux'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 Maintenance'
    labels:
      - 'maintenance'
      - 'chore'
exclude-labels:
  - 'skip-changelog'
  - 'docs'
change-template: '- $TITLE ($AUTHOR) #$NUMBER'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
